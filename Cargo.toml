[package]
name = "wreckless"
version = "2.0.2"
edition = "2024"
build = "build/build.rs"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["syzygy"]
syzygy = []
spsa = []
# Opt-in hit-rate counters for `lmr_prev_reduction` / `lmr_cutnode_null` (see
# search.rs). NOT part of default: it exists to answer "how often does each
# condition fire" for interpreting a joint SPRT of the two, not to ship in the
# binary that SPRT actually runs -- an unconditional atomic increment on a
# per-node branch is exactly the kind of overhead this file elsewhere goes out
# of its way to avoid (see check_time's node-mask gating). Build with
# `--features instrument`, run `bench` or a short self-play, read the counts
# via `dbg_print`, then go back to testing the plain default build.
instrument = []

[profile.dev]
opt-level = 3
debug = true
debug-assertions = true

[profile.release]
lto = "fat"
panic = "abort"
codegen-units = 1

[build-dependencies]
cc = "1.2.19"
bindgen = "0.71.1"

[dependencies]
libc = "0.2.175"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1"
wasm-bindgen = "0.2"
js-sys = "0.3"
